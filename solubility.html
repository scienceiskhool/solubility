<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Solubility Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            overflow-x: hidden;
            touch-action: manipulation;
        }
        @keyframes pop-in { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes confetti-fall { 
            0% { top: -10%; transform: translateX(0) rotate(0deg); opacity: 1; }
            100% { top: 110%; transform: translateX(20px) rotate(360deg); opacity: 0; } 
        }
        .animate-pop-in { animation: pop-in 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.2) both; }
        .animate-float { animation: float 5s ease-in-out infinite; }
        .animate-confetti-fall { animation: confetti-fall 4s linear infinite; }
        .hidden { display: none; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }

        /* Fullscreen-specific adjustments */
        :fullscreen #game-container {
            background-color: #f8fafc;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="confetti-container" class="fixed inset-0 pointer-events-none z-[999] hidden"></div>

    <div id="game-container" class="min-h-screen p-4 md:p-6 lg:p-8 relative flex flex-col transition-all duration-300">
        
        <!-- Top Toolbar (Always Visible) -->
        <div class="fixed top-4 right-4 z-[110] flex gap-2">
            <button onclick="toggleFullscreen()" class="p-3 bg-white/80 backdrop-blur shadow-md rounded-2xl text-slate-600 hover:text-indigo-600 border border-slate-200 transition-all active:scale-95" title="Toggle Fullscreen">
                <i data-lucide="maximize" class="w-5 h-5" id="fs-icon"></i>
            </button>
            <button onclick="toggleMute()" id="mute-btn" class="p-3 bg-white/80 backdrop-blur shadow-md rounded-2xl text-slate-600 hover:text-indigo-600 border border-slate-200 transition-all active:scale-95">
                <i data-lucide="volume-2" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- Rules Modal (Hint) -->
        <div id="rules-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[200] flex items-center justify-center p-4 hidden">
            <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-6 md:p-8 animate-pop-in border border-slate-100 overflow-y-auto max-h-[90vh]">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-black text-slate-800 flex items-center gap-2">
                        <i data-lucide="book-open" class="text-indigo-600"></i> Solubility Rules
                    </h3>
                    <button onclick="toggleRules(false)" class="p-2 hover:bg-slate-100 rounded-full transition-colors">
                        <i data-lucide="x" class="w-6 h-6 text-slate-400"></i>
                    </button>
                </div>
                <div id="rules-modal-list" class="space-y-3"></div>
                <button onclick="toggleRules(false)" class="w-full mt-8 py-4 bg-slate-800 text-white rounded-2xl font-bold shadow-lg active:scale-95 transition-all">CLOSE HINT</button>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="flex-1 flex items-center justify-center py-12">
            <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-6 md:p-8 border border-slate-100 animate-pop-in text-center relative mx-auto">
                <div class="inline-block p-4 bg-indigo-100 rounded-full mb-4 animate-float">
                    <i data-lucide="beaker" class="w-10 h-10 text-indigo-600"></i>
                </div>
                <h1 class="text-3xl font-black text-slate-800 leading-tight">Solubility Master</h1>
                <p class="text-indigo-500 font-bold text-xs uppercase tracking-widest mb-2">created by Ms Khoo Xiang Yun</p>
                <p class="text-slate-500 mb-6 text-sm">Memorize the rules to master the salts!</p>
                <div id="start-rules-list" class="space-y-2 mb-8 text-left max-h-[30vh] overflow-y-auto pr-2"></div>
                <button onclick="startGame()" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-bold text-lg shadow-lg active:scale-95 flex items-center justify-center gap-2">
                    <i data-lucide="play" fill="currentColor"></i> START CHALLENGE
                </button>
            </div>
        </div>

        <!-- Playing Screen -->
        <div id="playing-screen" class="max-w-4xl mx-auto w-full hidden flex-1 flex flex-col justify-center">
            <div class="flex flex-wrap justify-between items-center mb-6 bg-white/80 backdrop-blur p-4 rounded-2xl shadow-sm border border-slate-100 gap-4">
                <div class="flex items-center gap-4 sm:gap-6">
                    <div id="timer-display" class="flex items-center gap-2 font-mono text-xl sm:text-2xl font-black text-slate-700">
                        <i data-lucide="timer" class="w-5 h-5 sm:w-6 sm:h-6"></i> <span id="time-left">60</span>
                    </div>
                    <div class="h-8 w-px bg-slate-200"></div>
                    <div>
                        <div class="text-[10px] font-black text-slate-400 uppercase leading-none mb-1">Score</div>
                        <div id="points-display" class="text-lg sm:text-xl font-black text-indigo-600 leading-none">0</div>
                    </div>
                    
                    <div id="multiplier-badge" class="hidden sm:flex items-center gap-2 px-3 py-1 bg-indigo-100 text-indigo-700 rounded-full border border-indigo-200 shadow-sm transition-all duration-300">
                        <i data-lucide="zap" class="w-3 h-3" fill="currentColor"></i>
                        <div class="flex flex-col">
                            <span id="multiplier-text" class="text-[10px] font-black leading-none">1.0x</span>
                            <div class="w-16 h-1 bg-indigo-300/30 rounded-full mt-1 overflow-hidden">
                                <div id="multiplier-progress" class="h-full bg-indigo-600 transition-all duration-300" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div>
                    <button onclick="toggleRules(true)" class="flex items-center gap-2 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs font-black transition-all">
                        <i data-lucide="lightbulb" class="w-4 h-4"></i> HINT
                    </button>
                </div>
            </div>

            <div class="bg-white p-6 md:p-12 rounded-3xl shadow-xl border border-slate-100 text-center relative min-h-[350px] md:min-h-[420px] flex flex-col justify-center overflow-hidden">
                <!-- Feedback Overlays -->
                <div id="feedback-correct" class="absolute inset-0 flex flex-col items-center justify-center bg-white/90 z-30 hidden animate-pop-in">
                    <div class="bg-green-100 p-6 rounded-full mb-4 shadow-inner">
                        <i data-lucide="check-circle" class="w-16 h-16 text-green-600"></i>
                    </div>
                    <h2 id="correct-msg" class="text-3xl font-black text-green-700 mb-1">Dissolved!</h2>
                    <p class="text-green-600 font-bold uppercase tracking-widest text-sm">Correct Identification</p>
                </div>

                <div id="feedback-wrong" class="absolute inset-0 flex flex-col items-center justify-center bg-white/95 z-30 hidden animate-pop-in p-6">
                    <div class="bg-red-100 p-6 rounded-full mb-4 shadow-inner">
                        <i data-lucide="x-circle" class="w-12 h-12 md:w-16 md:h-16 text-red-600"></i>
                    </div>
                    <h2 class="text-2xl font-black text-red-700 mb-4">Incorrect</h2>
                    <div class="w-full max-w-sm p-4 md:p-6 bg-slate-50 rounded-2xl border border-slate-200 text-left mb-6 shadow-sm">
                        <div class="text-[10px] font-black text-slate-400 uppercase mb-2 tracking-widest">Scientific Rule</div>
                        <p id="rule-explanation" class="text-slate-700 font-bold italic text-base md:text-lg leading-relaxed"></p>
                    </div>
                    <button onclick="nextQuestion()" class="w-full max-w-sm py-4 bg-slate-800 text-white rounded-2xl font-black text-lg flex items-center justify-center gap-2 shadow-xl active:scale-95">
                        GOT IT <i data-lucide="arrow-right"></i>
                    </button>
                </div>

                <div id="question-content">
                    <span class="text-[10px] font-black uppercase tracking-[0.2em] text-indigo-400 mb-4 block animate-pulse">Identify Solubility</span>
                    <h2 id="salt-name" class="text-3xl md:text-5xl font-black text-slate-800 mb-2 lowercase"></h2>
                    <div id="salt-formula" class="text-indigo-600 text-xl md:text-2xl font-bold mb-8 md:mb-12 opacity-80"></div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-lg mx-auto w-full">
                        <button onclick="handleGuess(true)" class="py-5 md:py-6 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-black text-lg md:text-xl shadow-lg transition-all active:scale-95 border-b-4 border-blue-800">SOLUBLE</button>
                        <button onclick="handleGuess(false)" class="py-5 md:py-6 bg-orange-600 hover:bg-orange-700 text-white rounded-2xl font-black text-lg md:text-xl shadow-lg transition-all active:scale-95 border-b-4 border-orange-800">INSOLUBLE</button>
                    </div>
                </div>
            </div>

            <!-- History Logs (Hidden on small mobile height to save space, visible on iPad/Desktop) -->
            <div class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-4 h-40 sm:h-48">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                    <div class="p-2 bg-blue-50 border-b border-blue-100 text-center font-black text-blue-700 text-[10px] uppercase tracking-widest">Soluble Findings</div>
                    <div id="history-soluble" class="flex-1 overflow-y-auto p-2 space-y-1"></div>
                </div>
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                    <div class="p-2 bg-orange-50 border-b border-orange-100 text-center font-black text-orange-700 text-[10px] uppercase tracking-widest">Insoluble Findings</div>
                    <div id="history-insoluble" class="flex-1 overflow-y-auto p-2 space-y-1"></div>
                </div>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="min-h-screen flex items-center justify-center hidden p-4">
            <div class="max-w-2xl w-full bg-white rounded-3xl shadow-2xl p-6 md:p-10 text-center border border-slate-100 animate-pop-in">
                <i id="result-icon" data-lucide="trophy" class="w-16 h-16 md:w-24 md:h-24 mx-auto mb-4 text-amber-500"></i>
                <h2 id="result-title" class="text-3xl md:text-4xl font-black text-slate-800 mb-2">Phenomenal!</h2>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 md:gap-4 mb-8 mt-6">
                    <div class="bg-indigo-50 p-4 md:p-6 rounded-2xl">
                        <div id="final-points" class="text-indigo-600 text-2xl md:text-3xl font-black">0</div>
                        <div class="text-indigo-400 text-[10px] font-bold uppercase">Points</div>
                    </div>
                    <div class="bg-slate-50 p-4 md:p-6 rounded-2xl">
                        <div id="final-accuracy" class="text-slate-600 text-2xl md:text-3xl font-black">0%</div>
                        <div class="text-slate-400 text-[10px] font-bold uppercase">Accuracy</div>
                    </div>
                    <div class="bg-amber-50 p-4 md:p-6 rounded-2xl col-span-2 sm:col-span-1">
                        <div id="best-score-display" class="text-amber-600 text-2xl md:text-3xl font-black">0</div>
                        <div class="text-amber-400 text-[10px] font-bold uppercase">Best Score</div>
                    </div>
                </div>
                <button onclick="location.reload()" class="w-full sm:w-auto px-12 py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-bold text-lg shadow-lg active:scale-95 transition-all">Play Again</button>
            </div>
        </div>
    </div>

    <script>
        const saltsData = [
            { name: "sodium nitrate", formula: "(NaNO₃)", soluble: true, rule: "All Group 1 and Nitrate salts are soluble." },
            { name: "silver chloride", formula: "(AgCl)", soluble: false, rule: "Chlorides are soluble EXCEPT silver and lead(II)." },
            { name: "potassium carbonate", formula: "(K₂CO₃)", soluble: true, rule: "All Group 1 salts are soluble." },
            { name: "barium sulfate", formula: "(BaSO₄)", soluble: false, rule: "Sulfates are soluble EXCEPT barium, calcium, and lead(II)." },
            { name: "ammonium phosphate", formula: "((NH₄)₃PO₄)", soluble: true, rule: "All ammonium salts are soluble." },
            { name: "lead(II) chloride", formula: "(PbCl₂)", soluble: false, rule: "Chlorides are soluble EXCEPT silver and lead(II)." },
            { name: "magnesium hydroxide", formula: "(Mg(OH)₂)", soluble: true, rule: "Magnesium hydroxide is sparingly soluble." },
            { name: "calcium sulfate", formula: "(CaSO₄)", soluble: false, rule: "Sulfates are soluble EXCEPT barium, calcium, and lead(II)." },
            { name: "copper(II) sulfate", formula: "(CuSO₄)", soluble: true, rule: "Most sulfates are soluble." },
            { name: "iron(III) nitrate", formula: "(Fe(NO₃)₃)", soluble: true, rule: "All nitrates are soluble." },
            { name: "zinc carbonate", formula: "(ZnCO₃)", soluble: false, rule: "Carbonates are generally insoluble." },
            { name: "lithium hydroxide", formula: "(LiOH)", soluble: true, rule: "Group 1 hydroxides are soluble." },
            { name: "silver nitrate", formula: "(AgNO₃)", soluble: true, rule: "All nitrates are soluble." },
            { name: "lead(II) sulfate", formula: "(PbSO₄)", soluble: false, rule: "Sulfates are soluble EXCEPT barium, calcium, and lead(II)." },
            { name: "calcium nitrate", formula: "(Ca(NO₃)₂)", soluble: true, rule: "All nitrates are soluble." },
            { name: "aluminum oxide", formula: "(Al₂O₃)", soluble: false, rule: "Oxides are generally insoluble." },
            { name: "sodium hydroxide", formula: "(NaOH)", soluble: true, rule: "Group 1 hydroxides are soluble." },
            { name: "magnesium sulfate", formula: "(MgSO₄)", soluble: true, rule: "Most sulfates are soluble." },
            { name: "calcium carbonate", formula: "(CaCO₃)", soluble: false, rule: "Carbonates are generally insoluble." },
            { name: "potassium iodide", formula: "(KI)", soluble: true, rule: "All Group 1 salts are soluble." },
            { name: "lead(II) nitrate", formula: "(Pb(NO₃)₂)", soluble: true, rule: "All nitrates are soluble." },
            { name: "ammonium carbonate", formula: "((NH₄)₂CO₃)", soluble: true, rule: "Ammonium salts are always soluble." },
            { name: "potassium sulfate", formula: "(K₂SO₄)", soluble: true, rule: "Most sulfates are soluble." },
            { name: "copper(II) carbonate", formula: "(CuCO₃)", soluble: false, rule: "Carbonates are generally insoluble." },
            { name: "barium chloride", formula: "(BaCl₂)", soluble: true, rule: "Chlorides are generally soluble." },
            { name: "silver sulfate", formula: "(Ag₂SO₄)", soluble: true, rule: "Silver sulfate has low/partial solubility." },
            { name: "zinc sulfate", formula: "(ZnSO₄)", soluble: true, rule: "Most sulfates are soluble." },
            { name: "iron(II) sulfate", formula: "(FeSO₄)", soluble: true, rule: "Most sulfates are soluble." },
            { name: "sodium oxide", formula: "(Na₂O)", soluble: true, rule: "Group 1 oxides form soluble hydroxides." },
            { name: "magnesium chloride", formula: "(MgCl₂)", soluble: true, rule: "Chlorides are generally soluble." },
            { name: "lead(II) oxide", formula: "(PbO)", soluble: false, rule: "Oxides are generally insoluble." },
            { name: "calcium hydroxide", formula: "(Ca(OH)₂)", soluble: true, rule: "Calcium hydroxide is sparingly soluble." },
            { name: "ammonium sulfate", formula: "((NH₄)₂SO₄)", soluble: true, rule: "All ammonium salts are soluble." },
            { name: "zinc oxide", formula: "(ZnO)", soluble: false, rule: "Oxides are generally insoluble." },
            { name: "copper(II) chloride", formula: "(CuCl₂)", soluble: true, rule: "Chlorides are generally soluble." },
            { name: "lithium nitrate", formula: "(LiNO₃)", soluble: true, rule: "All nitrates are soluble." },
            { name: "magnesium carbonate", formula: "(MgCO₃)", soluble: false, rule: "Carbonates are generally insoluble." },
            { name: "iron(III) chloride", formula: "(FeCl₃)", soluble: true, rule: "Chlorides are generally soluble." },
            { name: "sodium phosphate", formula: "(Na₃PO₄)", soluble: true, rule: "All Group 1 salts are soluble." },
            { name: "barium nitrate", formula: "(Ba(NO₃)₂)", soluble: true, rule: "All nitrates are soluble." }
        ];

        const rulesList = [
            { text: "All Group 1 & Ammonium are SOLUBLE", color: "green" },
            { text: "All Nitrates are SOLUBLE", color: "green" },
            { text: "Chlorides: soluble except AgCl, PbCl₂", color: "yellow" },
            { text: "Sulfates: soluble except BaSO₄, CaSO₄, PbSO₄", color: "yellow" },
            { text: "Carbonates: INSOLUBLE except Grp 1 & ammonium", color: "red" },
            { text: "Oxides/Hydroxides: INSOLUBLE except Grp 1 & ammonium, and some Grp 2 (Mg, Ca)", color: "red" }
        ];

        let points = 0;
        let streak = 0;
        let correctCount = 0;
        let totalCount = 0;
        let timeLeft = 60;
        let currentSalt = null;
        let timer = null;
        let muted = false;
        let audioCtx = null;
        let highScore = localStorage.getItem('solubility_highscore') || 0;

        function init() {
            lucide.createIcons();
            populateRules('start-rules-list');
            populateRules('rules-modal-list');
        }

        function toggleFullscreen() {
            const elem = document.documentElement;
            const icon = document.getElementById('fs-icon');
            if (!document.fullscreenElement) {
                elem.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable full-screen mode: ${err.message}`);
                });
                icon.setAttribute('data-lucide', 'minimize');
            } else {
                document.exitFullscreen();
                icon.setAttribute('data-lucide', 'maximize');
            }
            lucide.createIcons();
        }

        function populateRules(elementId) {
            const container = document.getElementById(elementId);
            container.innerHTML = '';
            rulesList.forEach(r => {
                const div = document.createElement('div');
                let colorClasses = "";
                if (r.color === 'green') colorClasses = "bg-green-50 border-green-500 text-green-700";
                if (r.color === 'yellow') colorClasses = "bg-yellow-50 border-yellow-500 text-yellow-700";
                if (r.color === 'red') colorClasses = "bg-red-50 border-red-500 text-red-700";
                
                div.className = `p-2 border-l-4 text-xs font-bold rounded-r-xl ${colorClasses}`;
                div.innerText = r.text;
                container.appendChild(div);
            });
        }

        function toggleRules(show) {
            const modal = document.getElementById('rules-modal');
            if (show) modal.classList.remove('hidden');
            else modal.classList.add('hidden');
        }

        function getMultiplierStats(s) {
            let level = 0;
            let threshold = 2; 
            let count = s;
            while (count >= threshold) {
                count -= threshold;
                level++;
                threshold++;
            }
            return {
                multiplier: (1 + level * 0.5).toFixed(1),
                percent: (count / threshold) * 100
            };
        }

        function playSound(type) {
            if (muted) return;
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (type === 'fanfare') {
                [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.1);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.1 + 0.4);
                    osc.start(audioCtx.currentTime + i * 0.1); osc.stop(audioCtx.currentTime + i * 0.1 + 0.4);
                });
            } else if (type === 'gameover') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            } else {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                if (type === 'correct') {
                    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1320, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                } else {
                    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                }
            }
        }

        function createConfetti() {
            const container = document.getElementById('confetti-container');
            container.classList.remove('hidden');
            container.innerHTML = '';
            for (let i = 0; i < 100; i++) {
                const bit = document.createElement('div');
                bit.className = 'absolute animate-confetti-fall';
                bit.style.left = Math.random() * 100 + '%';
                bit.style.top = '-20px';
                bit.style.width = (Math.random() * 10 + 5) + 'px';
                bit.style.height = (Math.random() * 10 + 5) + 'px';
                bit.style.backgroundColor = ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#3b82f6'][Math.floor(Math.random() * 5)];
                bit.style.animationDuration = (Math.random() * 2 + 2) + 's';
                bit.style.animationDelay = (Math.random() * 3) + 's';
                container.appendChild(bit);
            }
        }

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('playing-screen').classList.remove('hidden');
            nextQuestion();
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('time-left').innerText = timeLeft;
                if (timeLeft <= 0) endGame();
            }, 1000);
        }

        function nextQuestion() {
            document.getElementById('feedback-correct').classList.add('hidden');
            document.getElementById('feedback-wrong').classList.add('hidden');
            currentSalt = saltsData[Math.floor(Math.random() * saltsData.length)];
            document.getElementById('salt-name').innerText = currentSalt.name;
            document.getElementById('salt-formula').innerText = currentSalt.formula;
        }

        function handleGuess(guess) {
            if (timeLeft <= 0) return;
            totalCount++;
            const isCorrect = guess === currentSalt.soluble;
            
            const historyItem = document.createElement('div');
            historyItem.className = `p-2 rounded-lg text-[10px] sm:text-xs font-bold border flex justify-between items-center ${isCorrect ? 'bg-white border-green-100' : 'bg-red-50 border-red-200 text-red-700'}`;
            historyItem.innerHTML = `<span>${currentSalt.name}</span> <i data-lucide="${isCorrect ? 'check-circle' : 'x-circle'}" class="w-3 h-3 ${isCorrect ? 'text-green-500' : 'text-red-500'}"></i>`;
            document.getElementById(currentSalt.soluble ? 'history-soluble' : 'history-insoluble').prepend(historyItem);
            lucide.createIcons();

            if (isCorrect) {
                correctCount++;
                streak++;
                const stats = getMultiplierStats(streak);
                points += Math.round(100 * parseFloat(stats.multiplier));
                
                document.getElementById('points-display').innerText = points.toLocaleString();
                document.getElementById('multiplier-text').innerText = stats.multiplier + 'x';
                document.getElementById('multiplier-progress').style.width = stats.percent + '%';
                document.getElementById('correct-msg').innerText = currentSalt.soluble ? "DisSolved!" : "Solid work!";
                
                playSound('correct');
                document.getElementById('feedback-correct').classList.remove('hidden');
                setTimeout(() => { if(timeLeft > 0) nextQuestion(); }, 800);
            } else {
                streak = 0;
                document.getElementById('multiplier-text').innerText = '1.0x';
                document.getElementById('multiplier-progress').style.width = '0%';
                
                playSound('wrong');
                document.getElementById('rule-explanation').innerText = `"${currentSalt.rule}"`;
                document.getElementById('feedback-wrong').classList.remove('hidden');
            }
        }

        function endGame() {
            clearInterval(timer);
            const accuracy = totalCount > 0 ? Math.round((correctCount / totalCount) * 100) : 0;
            if (points > highScore) {
                highScore = points;
                localStorage.setItem('solubility_highscore', points);
            }

            document.getElementById('playing-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            document.getElementById('final-points').innerText = points.toLocaleString();
            document.getElementById('final-accuracy').innerText = accuracy + '%';
            document.getElementById('best-score-display').innerText = highScore.toLocaleString();

            if (accuracy >= 80) {
                document.getElementById('result-title').innerText = "Phenomenal!";
                document.getElementById('result-icon').classList.add('text-amber-500');
                playSound('fanfare');
                createConfetti();
            } else {
                document.getElementById('result-title').innerText = "Good Effort!";
                document.getElementById('result-icon').classList.remove('text-amber-500');
                document.getElementById('result-icon').classList.add('text-slate-300');
                playSound('gameover');
            }
            lucide.createIcons();
        }

        function toggleMute() {
            muted = !muted;
            document.getElementById('mute-btn').innerHTML = `<i data-lucide="${muted ? 'volume-x' : 'volume-2'}" class="w-5 h-5"></i>`;
            lucide.createIcons();
        }

        window.onload = init;
    </script>
</body>
</html>
